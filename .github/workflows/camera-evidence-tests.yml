name: Synthetic Camera Evidence Tests

on:
  push:
    branches: [main]
    paths:
      - "examples/change-impact-demo/**"
      - "case-studies/01-uav-eo-camera-decision-architecture.md"
      - ".github/workflows/camera-evidence-tests.yml"
  pull_request:
    paths:
      - "examples/change-impact-demo/**"
      - "case-studies/01-uav-eo-camera-decision-architecture.md"
      - ".github/workflows/camera-evidence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==8.3.5
      - name: Check for clock-dependent dates
        run: |
          if grep -R -n -E 'datetime\.now\(|date\.today\(' examples/change-impact-demo/src/camera_evidence.py examples/change-impact-demo/data/generate_camera_cases.py; then
            echo "Clock-dependent code is forbidden in the synthetic fixture."
            exit 1
          fi
      - name: Generate deterministic synthetic dataset
        run: python examples/change-impact-demo/data/generate_camera_cases.py
      - name: Run tests and preserve raw output
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v examples/change-impact-demo/tests | tee pytest-v-raw.log
      - name: Run pinned-source diagnostic and negative control
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          digest=$(sha256sum examples/change-impact-demo/src/camera_evidence.py | cut -d ' ' -f1)
          python examples/change-impact-demo/diagnostics/run_diagnostic.py \
            --source-commit "$commit" --source-sha256 "$digest" --output diagnostic.json
          set +e
          python examples/change-impact-demo/diagnostics/run_diagnostic.py \
            --source-commit "$commit" --source-sha256 "$digest" \
            --inject-oracle-failure --output diagnostic-negative.json
          code=$?
          set -e
          test "$code" -eq 1
          python -c 'import json; r=json.load(open("diagnostic-negative.json")); assert r["all_pass"] is False and r["mismatch_count"] == 1 and "error" not in r'
      - name: Upload raw pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-evidence-pytest-raw
          path: |
            pytest-v-raw.log
            diagnostic.json
            diagnostic-negative.json
          if-no-files-found: warn
