name: Showcase CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s examples/change-impact-demo/tests -p "test_change_impact.py"

      - name: Run synthetic demonstration
        run: python examples/change-impact-demo/src/change_impact.py
